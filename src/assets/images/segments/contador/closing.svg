  <rect x="296" y="246" width="84" height="12" rx="4" fill="#f2b880"/>
  <rect x="356" y="212" width="20" height="8" rx="3" fill="#646cfa"/>
  <rect x="296" y="218" width="84" height="12" rx="4" fill="#646cfa"/>
