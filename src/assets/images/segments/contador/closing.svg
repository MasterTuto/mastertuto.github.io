<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img">
  <title>Contador e cliente conversando à mesa, com uma prancheta de itens marcados e pastas coloridas organizadas</title>
  <rect width="600" height="400" rx="28" fill="#f4f2f2"/>
