  <ellipse cx="554" cy="196" rx="10" ry="28" fill="#9fd3c7" transform="rotate(22 554 196)"/>
  <ellipse cx="542" cy="188" rx="9" ry="30" fill="#9fd3c7"/>
  <rect x="524" y="216" width="38" height="46" rx="8" fill="#f2b880"/>
