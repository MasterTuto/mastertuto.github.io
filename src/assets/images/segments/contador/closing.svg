  <path d="M392 262 L392 222 Q392 192 426 188 L474 188 Q508 192 508 222 L508 262 Z" fill="#151c25"/>
  <path d="M436 188 L450 216 L464 188 Z" fill="#fafafa"/>
  <circle cx="450" cy="148" r="30" fill="#8d5a3b"/>
