  <g fill="none" stroke="#151c25" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226.5 196 l2.5 2.5 l4.5 -5"/>
    <path d="M226.5 220 l2.5 2.5 l4.5 -5"/>
    <path d="M226.5 244 l2.5 2.5 l4.5 -5"/>
  </g>
  <g fill="#8e9095">
