<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img">
  <title>Celular cheio de fotos de notas fiscais, áudios e anexos, cercado por recibos soltos, um envelope e um calendário com um dia marcado</title>
  <rect width="100%" height="100%" rx="32" fill="#eaebf9"/>
  <!-- envelope -->
  <g transform="rotate(-10 115 150)">
    <rect x="58" y="112" width="114" height="76" rx="8" fill="#fafafa"/>
    <path d="M62 118 L115 158 L168 118" fill="none" stroke="#646cfa" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- calendar page -->
  <g transform="rotate(8 500 180)">
    <rect x="440" y="120" width="120" height="120" rx="12" fill="#fafafa"/>
    <path d="M440 132 a12 12 0 0 1 12 -12 h96 a12 12 0 0 1 12 12 v16 h-120 z" fill="#7a70e1"/>
    <g fill="#eaebf9">
      <rect x="452" y="160" width="18" height="14" rx="3"/>
      <rect x="476" y="160" width="18" height="14" rx="3"/>
      <rect x="500" y="160" width="18" height="14" rx="3"/>
      <rect x="524" y="160" width="18" height="14" rx="3"/>
      <rect x="452" y="182" width="18" height="14" rx="3"/>
      <rect x="476" y="182" width="18" height="14" rx="3"/>
      <rect x="524" y="182" width="18" height="14" rx="3"/>
      <rect x="452" y="204" width="18" height="14" rx="3"/>
      <rect x="476" y="204" width="18" height="14" rx="3"/>
      <rect x="500" y="204" width="18" height="14" rx="3"/>
      <rect x="524" y="204" width="18" height="14" rx="3"/>
    </g>
    <rect x="500" y="182" width="18" height="14" rx="3" fill="#f2b880"/>
    <circle cx="509" cy="189" r="14" fill="none" stroke="#151c25" stroke-width="3"/>
  </g>
  <!-- loose receipts -->
  <g transform="rotate(-14 110 450)">
    <path d="M66 380 h88 v130 l-11 -8 l-11 8 l-11 -8 l-11 8 l-11 -8 l-11 8 l-11 -8 l-11 8 z" fill="#fafafa"/>
    <rect x="80" y="398" width="56" height="5" rx="2.5" fill="#8e9095"/>
    <rect x="80" y="412" width="40" height="5" rx="2.5" fill="#8e9095"/>
    <rect x="80" y="426" width="50" height="5" rx="2.5" fill="#8e9095"/>
    <rect x="80" y="470" width="60" height="7" rx="3.5" fill="#444a51"/>
  </g>
  <g transform="translate(-18 0) rotate(12 150 500)">
    <path d="M112 440 h80 v104 l-10 -7 l-10 7 l-10 -7 l-10 7 l-10 -7 l-10 7 l-10 -7 l-10 7 z" fill="#fafafa"/>
    <rect x="124" y="456" width="50" height="5" rx="2.5" fill="#8e9095"/>
    <rect x="124" y="470" width="34" height="5" rx="2.5" fill="#8e9095"/>
    <rect x="124" y="514" width="54" height="7" rx="3.5" fill="#f2b880"/>
  </g>
  <!-- folders, unsorted -->
  <g transform="rotate(-6 500 470)">
    <rect x="436" y="470" width="128" height="18" rx="4" fill="#9fd3c7"/>
    <rect x="446" y="452" width="118" height="18" rx="4" fill="#646cfa"/>
  </g>
  <rect x="440" y="432" width="112" height="18" rx="4" fill="#f2b880" transform="rotate(9 496 441)"/>
  <!-- phone -->
  <ellipse cx="300" cy="530" rx="130" ry="12" fill="#151c25" opacity="0.08"/>
  <rect x="190" y="70" width="220" height="448" rx="32" fill="#151c25"/>
  <rect x="202" y="84" width="196" height="420" rx="22" fill="#fafafa"/>
  <path d="M202 106 a22 22 0 0 1 22 -22 h152 a22 22 0 0 1 22 22 v32 h-196 z" fill="#7a70e1"/>
  <circle cx="226" cy="112" r="12" fill="#fafafa"/>
  <rect x="246" y="106" width="70" height="7" rx="3.5" fill="#fafafa" opacity="0.8"/>
  <rect x="246" y="117" width="44" height="5" rx="2.5" fill="#fafafa" opacity="0.5"/>
  <circle cx="404" cy="76" r="15" fill="#f2b880" stroke="#eaebf9" stroke-width="4"/>
  <!-- photo of a receipt -->
  <rect x="212" y="148" width="124" height="82" rx="12" fill="#eaebf9"/>
  <rect x="226" y="156" width="96" height="66" rx="6" fill="#8e9095"/>
  <g transform="rotate(-8 274 189)">
    <path d="M254 160 h40 v52 l-5 -4 l-5 4 l-5 -4 l-5 4 l-5 -4 l-5 4 l-5 -4 l-5 4 z" fill="#fafafa"/>
    <rect x="260" y="170" width="26" height="3" rx="1.5" fill="#8e9095"/>
    <rect x="260" y="178" width="18" height="3" rx="1.5" fill="#8e9095"/>
  </g>
  <!-- second photo -->
  <rect x="212" y="240" width="124" height="82" rx="12" fill="#eaebf9"/>
  <rect x="226" y="248" width="96" height="66" rx="6" fill="#444a51"/>
  <g transform="rotate(10 274 281)">
    <path d="M254 252 h40 v52 l-5 -4 l-5 4 l-5 -4 l-5 4 l-5 -4 l-5 4 l-5 -4 l-5 4 z" fill="#fafafa"/>
    <rect x="260" y="262" width="26" height="3" rx="1.5" fill="#8e9095"/>
    <rect x="260" y="270" width="18" height="3" rx="1.5" fill="#8e9095"/>
  </g>
  <!-- text bubble -->
  <rect x="212" y="332" width="150" height="38" rx="12" fill="#eaebf9"/>
  <rect x="224" y="343" width="110" height="5" rx="2.5" fill="#8e9095"/>
  <rect x="224" y="355" width="74" height="5" rx="2.5" fill="#8e9095"/>
  <!-- voice message -->
  <rect x="212" y="380" width="160" height="38" rx="12" fill="#eaebf9"/>
  <path d="M226 389 l14 10 l-14 10 z" fill="#7a70e1"/>
  <g fill="#8e9095">
    <rect x="250" y="395" width="4" height="8" rx="2"/>
    <rect x="258" y="390" width="4" height="18" rx="2"/>
    <rect x="266" y="393" width="4" height="12" rx="2"/>
    <rect x="274" y="388" width="4" height="22" rx="2"/>
    <rect x="282" y="394" width="4" height="10" rx="2"/>
    <rect x="290" y="391" width="4" height="16" rx="2"/>
    <rect x="298" y="395" width="4" height="8" rx="2"/>
    <rect x="306" y="390" width="4" height="18" rx="2"/>
    <rect x="314" y="393" width="4" height="12" rx="2"/>
    <rect x="322" y="396" width="4" height="6" rx="2"/>
    <rect x="330" y="392" width="4" height="14" rx="2"/>
  </g>
  <!-- attachment -->
  <rect x="212" y="428" width="140" height="40" rx="12" fill="#eaebf9"/>
  <path d="M224 436 h16 l8 8 v18 h-24 z" fill="#646cfa"/>
  <rect x="256" y="440" width="72" height="5" rx="2.5" fill="#8e9095"/>
  <rect x="256" y="451" width="44" height="5" rx="2.5" fill="#8e9095"/>
  <!-- input bar -->
  <rect x="212" y="478" width="176" height="16" rx="8" fill="#eaebf9"/>
</svg>
