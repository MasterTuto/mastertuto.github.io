<div class="q-ticket">
  <header class="q-head">
    <inv-logo [doc]="doc()" [monogram]="true" />
    <inv-party [party]="doc().emitter" />
  </header>
  <h1>{{ doc().title }} · {{ doc().number }}</h1>
  <inv-meta [doc]="doc()" />
  <inv-party [party]="doc().client" [label]="doc().t.billTo" />
  <inv-items [doc]="doc()" [stack]="true" />
  <inv-totals [doc]="doc()" />
  <inv-pay [doc]="doc()" />
  <inv-notes [doc]="doc()" />
  <p class="q-thanks">{{ doc().t.thanks }}</p>
</div>
