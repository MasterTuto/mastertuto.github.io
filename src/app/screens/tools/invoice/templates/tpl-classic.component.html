<header class="c-head">
  <div class="c-from">
    <inv-logo [doc]="doc()" />
    <inv-party [party]="doc().emitter" />
  </div>
  <div class="c-title">
    <h1>{{ doc().title }}</h1>
    <inv-meta [doc]="doc()" />
  </div>
</header>
<section class="c-to">
  <inv-party [party]="doc().client" [label]="doc().t.billTo" />
</section>
<inv-items [doc]="doc()" />
<div class="c-sum">
  <inv-notes [doc]="doc()" />
  <inv-totals [doc]="doc()" />
</div>
<inv-pay [doc]="doc()" />
<footer class="c-foot">{{ doc().t.thanks }}</footer>
