<header class="n-head">
  <h1>{{ doc().title }}<span class="n-dot">.</span></h1>
  <inv-logo [doc]="doc()" />
</header>
<div class="n-grid">
  <inv-party [party]="doc().emitter" [label]="doc().t.from" />
  <inv-party [party]="doc().client" [label]="doc().t.billTo" />
  <inv-meta [doc]="doc()" />
</div>
<inv-items [doc]="doc()" />
<div class="n-totals"><inv-totals [doc]="doc()" /></div>
<div class="n-foot">
  <inv-pay [doc]="doc()" />
  <inv-notes [doc]="doc()" />
</div>
