<app-section name="home" containerClass="bg-surface-1 px-6 pb-6">
  <div class="flex flex-col-reverse md:flex-row items-center">
    <div class="flex-1 flex flex-col gap-3">
      <p class="text-4xl md:max-w-[18ch] leading-normal font-semibold text-surface-0-foreground" [innerHTML]="'home.title' | translate"></p>
      <p class="text-muted-foreground">{{ "home.description" | translate }}</p>
      <div>
        <a bcs-button [href]="whatsappLink" target="_blank" rel="noopener">
          {{ "home.websiteLikeThis" | translate}}

          <ng-icon name="tablerArrowRight" />
        </a>
      </div>
    </div>
    <div class="1">
      <img src="assets/luz-render.png" class="w-full" />
    </div>
  </div>
</app-section>
