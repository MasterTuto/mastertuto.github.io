<app-section name="projects" title="home.projects.name" containerClass="items-center gap-6 px-4">
  <div class="flex flex-col items-center gap-3 text-center">
    <h3 class="text-foreground text-4xl max-w-[18ch] font-semibold">
      {{ "home.projects.title" | translate }}
    </h3>
    <p class="text-foreground-light max-w-[60ch]">
      {{ "home.projects.description" | translate }}
    </p>
  </div>

  <div class="grid w-full max-w-6xl grid-cols-1 gap-6 md:grid-cols-2">
    @for (project of projects; track project.nameKey) {
      <button type="button" (click)="openProject(project)" class="group flex min-w-0 flex-col gap-3 text-left">
        <div class="relative w-full aspect-video overflow-hidden rounded-lg">
          <img
            [src]="project.cover"
            [alt]="project.nameKey | translate"
            loading="lazy"
            class="h-full w-full object-cover object-top transition duration-500 group-hover:scale-110"
          >
          <div class="absolute inset-0 bg-primary/0 transition duration-300 group-hover:bg-primary/35"></div>
        </div>

        <div class="flex flex-col gap-1">
          <p class="text-lg font-semibold text-foreground">{{ project.nameKey | translate }}</p>
          <p class="text-foreground-light">{{ project.descriptionKey | translate }}</p>
        </div>
      </button>
    }
  </div>

</app-section>
