<!--
  Order follows the visitor's questions: who is this (hero) → what do you do (services) → why you
  (why-me) → show me (projects) → who vouches (testimonials) → let's talk (scheduling). The meeting
  call to action closes the page (serial-position effect: the last item is the one remembered).
-->
<div class="flex flex-col gap-16 md:gap-24">
    <app-home-section />
    <app-services-section bcs-reveal />
    <app-why-me-section bcs-reveal />
    <app-projects-section />
    <app-testimonials-section bcs-reveal />
    <section class="px-4 py-4">
      <nav class="mx-auto flex w-full max-w-6xl items-center justify-center gap-6 rounded-md bg-surface-1 px-4 py-5 text-lg font-semibold text-surface-0-foreground" aria-label="Jogos e ferramentas">
        <a routerLink="/games" class="transition hover:text-accent">{{ 'games.label' | translate }} →</a>
        <span aria-hidden="true" class="text-muted-foreground">·</span>
        <a routerLink="/tools" class="transition hover:text-accent">{{ 'tools.label' | translate }} →</a>
      </nav>
    </section>
    <app-scheduling-section bcs-reveal="fade" />
</div>
