<div class="relative group flex items-center gap-2 text-muted-100 mt-4 p-1 hover:bg-muted-100 rounded-t-md transition-all whitespace-pre">
    <ng-icon [name]="icon()" size="32" class="transition-all group-hover:text-primary-900" [strokeWidth]="2"></ng-icon>
    <span class="top-full absolute -translate-x-1 opacity-0 pointer-events-none group-hover:pointer-events-auto group-hover:opacity-100 transition-all text-primary-900 bg-muted-100 font-semibold rounded-md rounded-tl-none p-3">
        <ng-content></ng-content>
    </span>
</div>
